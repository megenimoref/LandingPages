name = "paskol-form"
main = "src/index.js"
compatibility_date = "2026-09-01"

# KV namespace that holds the dedications.
# Create it once, then paste the returned id here:
#   npx wrangler kv namespace create DEDICATIONS
[[kv_namespaces]]
binding = "DEDICATIONS"
id = "59609f2f9d9f4d058ef36e8ba99b27b3"

# Custom hostname on the oref-main.com zone (optional — the workers.dev
# URL works too). Uncomment after the route is wanted:
# [[routes]]
# pattern = "paskol.oref-main.com/api/*"
# zone_name = "oref-main.com"

# ADMIN_TOKEN is a secret, never a var:
#   npx wrangler secret put ADMIN_TOKEN

# Plain vars belong here, not in the dashboard: `wrangler deploy` replaces the
# whole binding set, so a Text variable added in the UI is wiped by the next
# deploy. Secrets are preserved across deploys, so ADMIN_TOKEN and
# NOTIFY_HUB_TOKEN are set with `wrangler secret put` (or Type: Secret in the
# dashboard) and deliberately do NOT appear here.
[vars]
NOTIFY_HUB_URL = "https://notify.oref-main.com/notify/paskol-dedication"
