<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img"
    aria-label="מציין מיקום - סגנון קולנועי">
    <defs>
        <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2A0512" />
            <stop offset="0.38" stop-color="#6A0E24" />
            <stop offset="0.62" stop-color="#C22A38" />
            <stop offset="0.82" stop-color="#F0952E" />
            <stop offset="1" stop-color="#3D0715" />
        </linearGradient>
        <radialGradient id="sun1" cx="0.68" cy="0.62" r="0.34">
            <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.95" />
            <stop offset="0.4" stop-color="#FFB03A" stop-opacity="0.55" />
            <stop offset="1" stop-color="#FF8A2A" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFE9A8" />
            <stop offset="1" stop-color="#F0A93A" />
        </linearGradient>
        <linearGradient id="vig1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#12030A" stop-opacity="0.92" />
            <stop offset="0.22" stop-color="#12030A" stop-opacity="0" />
            <stop offset="0.78" stop-color="#12030A" stop-opacity="0" />
            <stop offset="1" stop-color="#12030A" stop-opacity="0.95" />
        </linearGradient>
        <filter id="soft1" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="9" />
        </filter>
    </defs>

    <rect width="800" height="1000" fill="url(#sky1)" />
    <ellipse cx="545" cy="620" rx="330" ry="270" fill="url(#sun1)" />

    <!-- volumetric rays -->
    <g opacity="0.2" fill="#FFD98A">
        <path d="M545 620 L250 0 L360 0Z" />
        <path d="M545 620 L470 0 L560 0Z" />
        <path d="M545 620 L700 0 L800 60Z" />
    </g>

    <!-- distant hills -->
    <path d="M0 700 C140 645 250 690 380 668 C520 644 640 692 800 656 L800 1000 L0 1000Z" fill="#3A0812"
        opacity="0.92" />
    <path d="M0 762 C170 716 300 754 450 736 C600 718 700 752 800 730 L800 1000 L0 1000Z" fill="#22050D" />

    <!-- pomegranate branch, left -->
    <g stroke="#1A0308" stroke-width="9" fill="none" opacity="0.95">
        <path d="M-10 120 C120 150 190 100 260 170" />
        <path d="M120 143 C150 200 130 240 96 268" />
        <path d="M232 148 C266 196 262 244 236 276" />
    </g>
    <g fill="#C4152E">
        <circle cx="96" cy="292" r="30" />
        <circle cx="236" cy="300" r="25" />
        <circle cx="168" cy="196" r="19" />
    </g>
    <g fill="#FF6B7A" opacity="0.55">
        <circle cx="88" cy="283" r="9" />
        <circle cx="230" cy="292" r="7" />
    </g>

    <!-- bokeh -->
    <g filter="url(#soft1)" opacity="0.5">
        <circle cx="662" cy="470" r="26" fill="#FFD98A" />
        <circle cx="716" cy="556" r="18" fill="#FFC46A" />
        <circle cx="604" cy="536" r="14" fill="#FFE9A8" />
        <circle cx="142" cy="520" r="20" fill="#FF9A5A" />
        <circle cx="252" cy="470" r="12" fill="#FFD98A" />
    </g>

    <!-- rim-lit family silhouettes -->
    <g fill="#180309">
        <circle cx="272" cy="616" r="60" />
        <path d="M186 776c0-50 38-90 86-90s86 40 86 90v190H186z" />
        <circle cx="416" cy="652" r="43" />
        <path d="M354 776c0-35 28-62 62-62s62 27 62 62v190H354z" />
        <circle cx="540" cy="624" r="53" />
        <path d="M464 770c0-42 34-76 76-76s76 34 76 76v196H464z" />
    </g>
    <g fill="none" stroke="#FFC96A" stroke-width="5" opacity="0.85">
        <path d="M322 588 a60 60 0 01 8 60" />
        <path d="M452 630 a43 43 0 01 6 44" />
        <path d="M586 600 a53 53 0 01 7 52" />
    </g>

    <rect width="800" height="1000" fill="url(#vig1)" />

    <!-- greeting -->
    <text x="400" y="150" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="58" font-weight="800"
        fill="url(#gold1)">שנה טובה ומתוקה</text>
    <text x="400" y="200" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="27" font-weight="500"
        fill="#FFE9C4" opacity="0.85">· ממשפחת ישראלי ·</text>

    <text x="400" y="938" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="22" font-weight="600"
        fill="#FFD98A" opacity="0.6">דוגמה · החליפו ב-after1.webp</text>
</svg>
