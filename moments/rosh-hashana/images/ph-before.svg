<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img"
    aria-label="מציין מיקום לתמונה המקורית">
    <defs>
        <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4A4A50" />
            <stop offset="0.55" stop-color="#37373D" />
            <stop offset="1" stop-color="#26262B" />
        </linearGradient>
        <radialGradient id="glB" cx="0.5" cy="0.34" r="0.62">
            <stop offset="0" stop-color="#6E6E78" stop-opacity="0.55" />
            <stop offset="1" stop-color="#6E6E78" stop-opacity="0" />
        </radialGradient>
    </defs>

    <rect width="800" height="1000" fill="url(#bgB)" />
    <rect width="800" height="1000" fill="url(#glB)" />

    <!-- plain snapshot framing marks -->
    <g stroke="#8A8A94" stroke-opacity="0.45" stroke-width="3" fill="none">
        <path d="M70 150 h60 M70 150 v60" />
        <path d="M730 150 h-60 M730 150 v60" />
        <path d="M70 850 h60 M70 850 v-60" />
        <path d="M730 850 h-60 M730 850 v-60" />
    </g>

    <!-- neutral group silhouette -->
    <g fill="#5C5C66" opacity="0.9">
        <circle cx="285" cy="560" r="62" />
        <path d="M195 720c0-52 40-92 90-92s90 40 90 92v130H195z" />
        <circle cx="430" cy="600" r="44" />
        <path d="M366 726c0-36 29-64 64-64s64 28 64 64v124H366z" />
        <circle cx="545" cy="572" r="54" />
        <path d="M467 716c0-44 35-78 78-78s78 34 78 78v134H467z" />
    </g>

    <!-- camera glyph -->
    <g transform="translate(400 350)" fill="none" stroke="#9A9AA4" stroke-width="7" stroke-linejoin="round">
        <path d="M-74-30h32l14-20h56l14 20h32a14 14 0 0114 14v76a14 14 0 01-14 14h-148a14 14 0 01-14-14v-76a14 14 0 0114-14z" />
        <circle cx="0" cy="24" r="30" />
    </g>

    <text x="400" y="470" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="40" font-weight="700"
        fill="#B4B4BE">התמונה שלכם</text>
    <text x="400" y="516" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="24" font-weight="400"
        fill="#8A8A94">before.webp</text>
</svg>
