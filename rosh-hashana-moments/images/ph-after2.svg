<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img"
    aria-label="מציין מיקום - סגנון מלכותי">
    <defs>
        <radialGradient id="room2" cx="0.5" cy="0.46" r="0.78">
            <stop offset="0" stop-color="#7A2018" />
            <stop offset="0.45" stop-color="#400A12" />
            <stop offset="1" stop-color="#12030A" />
        </radialGradient>
        <radialGradient id="flame2" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#FFF1C0" stop-opacity="0.95" />
            <stop offset="0.35" stop-color="#FFC24A" stop-opacity="0.6" />
            <stop offset="1" stop-color="#FF8A2A" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFEFB8" />
            <stop offset="1" stop-color="#D89A2A" />
        </linearGradient>
        <linearGradient id="cloth2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6E0F22" />
            <stop offset="1" stop-color="#2A040E" />
        </linearGradient>
        <linearGradient id="vig2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0B0206" stop-opacity="0.9" />
            <stop offset="0.24" stop-color="#0B0206" stop-opacity="0" />
            <stop offset="0.76" stop-color="#0B0206" stop-opacity="0" />
            <stop offset="1" stop-color="#0B0206" stop-opacity="0.95" />
        </linearGradient>
    </defs>

    <rect width="800" height="1000" fill="url(#room2)" />

    <!-- candle glow pools -->
    <ellipse cx="196" cy="640" rx="180" ry="150" fill="url(#flame2)" />
    <ellipse cx="614" cy="632" rx="170" ry="145" fill="url(#flame2)" />

    <!-- family silhouettes behind the table -->
    <g fill="#1C0409">
        <circle cx="286" cy="520" r="58" />
        <path d="M202 676c0-48 38-86 84-86s84 38 84 86v120H202z" />
        <circle cx="424" cy="556" r="42" />
        <path d="M364 678c0-34 27-60 60-60s60 26 60 60v118H364z" />
        <circle cx="544" cy="528" r="51" />
        <path d="M470 672c0-41 33-74 74-74s74 33 74 74v124H470z" />
    </g>
    <g fill="none" stroke="#FFC24A" stroke-width="5" opacity="0.75">
        <path d="M334 494 a58 58 0 01 8 58" />
        <path d="M458 536 a42 42 0 01 6 42" />
        <path d="M588 506 a51 51 0 01 7 50" />
    </g>

    <!-- table -->
    <path d="M0 790 L800 790 L800 1000 L0 1000Z" fill="url(#cloth2)" />
    <rect x="0" y="782" width="800" height="14" fill="#8A6420" opacity="0.85" />

    <!-- candlesticks -->
    <g fill="#B8860B">
        <rect x="182" y="632" width="16" height="150" />
        <rect x="158" y="776" width="64" height="12" rx="4" />
        <rect x="602" y="640" width="16" height="142" />
        <rect x="578" y="776" width="64" height="12" rx="4" />
    </g>
    <g fill="#FFD98A">
        <ellipse cx="190" cy="612" rx="11" ry="24" />
        <ellipse cx="610" cy="620" rx="11" ry="24" />
    </g>

    <!-- honey jar -->
    <g>
        <path d="M368 836 h64 a10 10 0 0110 10 v58 a14 14 0 01-14 14 h-56 a14 14 0 01-14-14 v-58 a10 10 0 0110-10z"
            fill="#E8A020" />
        <rect x="362" y="822" width="76" height="16" rx="6" fill="#C4821A" />
        <path d="M400 822 v-34" stroke="#B8860B" stroke-width="7" fill="none" />
    </g>

    <!-- apples -->
    <g fill="#C4152E">
        <circle cx="268" cy="884" r="40" />
        <circle cx="196" cy="900" r="30" />
    </g>
    <g stroke="#5A3810" stroke-width="6" fill="none">
        <path d="M268 844 v-20" />
        <path d="M196 870 v-16" />
    </g>
    <g fill="#FF6B7A" opacity="0.45">
        <circle cx="254" cy="868" r="12" />
        <circle cx="186" cy="890" r="9" />
    </g>

    <!-- split pomegranate -->
    <g>
        <circle cx="566" cy="886" r="42" fill="#8E0F22" />
        <circle cx="566" cy="886" r="30" fill="#D8455A" />
        <g fill="#FF8FA0">
            <circle cx="554" cy="876" r="6" />
            <circle cx="572" cy="872" r="6" />
            <circle cx="562" cy="892" r="6" />
            <circle cx="580" cy="890" r="6" />
            <circle cx="548" cy="894" r="6" />
        </g>
    </g>

    <!-- challah -->
    <ellipse cx="682" cy="900" rx="66" ry="30" fill="#C98B34" />
    <g stroke="#8A5A18" stroke-width="5" fill="none" opacity="0.7">
        <path d="M628 896 q26 -16 52 0 q26 16 52 0" />
    </g>

    <rect width="800" height="1000" fill="url(#vig2)" />

    <!-- greeting -->
    <text x="400" y="152" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="58" font-weight="800"
        fill="url(#gold2)">שנה טובה ומתוקה</text>
    <text x="400" y="202" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="27" font-weight="500"
        fill="#FFE9C4" opacity="0.85">· ממשפחת ישראלי ·</text>

    <text x="400" y="962" text-anchor="middle" font-family="Heebo, Arial, sans-serif" font-size="22" font-weight="600"
        fill="#FFD98A" opacity="0.6">דוגמה · החליפו ב-after2.webp</text>
</svg>
